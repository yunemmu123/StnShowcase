<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower Inventory Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101116;--panel:#181a22;--line:#2a2d3a;--tx:#eceef5;--mu:#8d92a6;--gold:#ffc83d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 14px/1.4 Montserrat,system-ui,sans-serif;background-image:radial-gradient(#23263 1px,transparent 1px)}
main{max-width:1000px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:24px;font-weight:800;margin:0 0 4px}p.s{color:var(--mu);margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
input{flex:1 1 220px;min-width:0}button{cursor:pointer;font-weight:700}button:hover{border-color:var(--gold)}
button.pri{background:var(--gold);color:#1a1405;border-color:var(--gold)}
button.on{border-color:var(--gold);color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sec{margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.card{background:var(--panel);border:2px solid var(--c);border-radius:10px;overflow:hidden;text-align:center;cursor:pointer;opacity:.38;transition:opacity .12s}
.card.own{opacity:1}.card img{display:block;width:100%;height:84px;object-fit:contain;background:#14151b}
.card b{display:block;color:var(--c);font-size:12px;padding:5px 2px 2px}
.card .evo{width:calc(100% - 10px);margin:0 5px 6px;padding:3px;font-size:11px}.card .evo.on{background:#7c3aed;border-color:#a78bfa;color:#fff}.card select{width:calc(100% - 10px);margin:0 5px 6px;padding:3px;font-size:12px}
.prev{margin-top:28px}.prev canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#14151b}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:8px 16px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style></head><body><main>
<h1>Tower Inventory Generator</h1>
<p class="s">Pick the towers and pets you own, set their levels, and copy the result as an image for Discord.</p>
<div class="bar"><input id="t" placeholder="Title (e.g. My Inventory)" maxlength="60"><input id="u" placeholder="Subtitle (optional)" maxlength="80"></div>
<div class="bar">
<button id="all">Select all</button><button id="none">Clear selection</button><button id="max">Set all to MAX</button>
<select id="sort" aria-label="Sort"><option value="r">Sort: Rarity</option><option value="t">Sort: Category</option></select>
<button id="un">Show unowned: Off</button>
</div>
<div id="list"></div>
<div class="prev"><div class="bar"><button class="pri" id="copy">Copy image</button><button id="dl">Download image</button><button id="reset">Reset everything</button></div><canvas id="cv" width="10" height="10"></canvas></div>
<div id="toast"></div></main>

const RAR=[['exclusive','Exclusive','#ff9a1f'],['divine','Divine','#f4e1ff'],['legendary','Legendary','#ffc83d'],['mythic','Mythic','#ff4d4d'],['epic','Epic','#9b5cff'],['rare','Rare','#3d8bff'],['common','Common','#5ce05c']];
const CAT=[['D','Damage'],['S','Support'],['F','Farm'],['P','Pets']];
const RC=Object.fromEntries(RAR.map(r=>[r[0],r[2]])),RI=Object.fromEntries(RAR.map((r,i)=>[r[0],i]));
const KEY='towerInv1',MAX=99;
const mx=o=>o.t==='P'?5:['Military Base','Medical Base','Protector Base'].includes(o.n)?6:['Crossbow','Turret'].includes(o.n)?10:o.r==='divine'?9:8;
let S={lv:{},evo:{},t:'',u:'',sort:'r',un:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
const imgs=ITEMS.map(o=>{const i=new Image();i.src=o.i;return i});
const groups=()=>{const by=S.sort==='r'?(o=>o.r):(o=>o.t);
 const g=(S.sort==='r'?RAR.map(r=>[r[0],r[1],r[2]]):CAT.map(c=>[c[0],c[1],'#eceef5']));
 return g.map(([k,n,c])=>({n,c,it:ITEMS.map((o,i)=>i).filter(i=>by(ITEMS[i])===k).sort((a,b)=>RI[ITEMS[a].r]-RI[ITEMS[b].r])})).filter(x=>x.it.length)};
function build(){
 const L=$('list');L.innerHTML='';
 groups().forEach(g=>{const h=document.createElement('div');h.className='sec';h.textContent=g.n;h.style.color=g.c;L.appendChild(h);
  const gr=document.createElement('div');gr.className='grid';
  g.it.forEach(i=>{const o=ITEMS[i],c=document.createElement('div');c.className='card';c.style.setProperty('--c',RC[o.r]);c.dataset.i=i;
   c.innerHTML='<img alt="" src="'+o.i+'"><b>'+o.n+'</b><select aria-label="'+o.n+' level">'+[...Array(mx(o)-1)].map((_,k)=>'<option value="'+(k+1)+'">LVL '+(k+1)+'</option>').join('')+'<option value="99">MAX</option></select>'+(o.e?'<button class="evo"></button>':'');
   const s=c.querySelector('select'),eb=c.querySelector('.evo');if(eb)eb.onclick=e=>{e.stopPropagation();S.evo[o.n]=!S.evo[o.n];if(!S.lv[o.n])S.lv[o.n]=MAX;sync()};
   s.onclick=e=>e.stopPropagation();
   s.onchange=()=>{S.lv[o.n]=+s.value;sync()};
   c.onclick=()=>{S.lv[o.n]=S.lv[o.n]?0:MAX;sync()};
   gr.appendChild(c)});L.appendChild(gr)});
 sync(true)}
function sync(skip){
 document.querySelectorAll('.card').forEach(c=>{const o=ITEMS[c.dataset.i];let v=S.lv[o.n]||0;if(v&&v!==MAX&&v>=mx(o))v=S.lv[o.n]=MAX;c.classList.toggle('own',!!v);c.querySelector('select').value=v||MAX;const eb=c.querySelector('.evo');if(eb){eb.textContent='EVO: '+(S.evo[o.n]?'Yes':'No');eb.classList.toggle('on',!!S.evo[o.n])}});
 $('un').textContent='Show unowned: '+(S.un?'On':'Off');$('un').classList.toggle('on',S.un);
 save();draw()}
function rr(x,c,a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function render(){
 const TW=150,TH=168,G=10,P=16,COLS=4,W=P*2+TW*COLS+G*(COLS-1);
 const gs=groups().map(g=>({...g,it:g.it.filter(i=>S.un||S.lv[ITEMS[i].n])})).filter(g=>g.it.length);
 const hd=(S.t||S.u)?(S.t&&S.u?74:52):0;
 let H=P+hd;gs.forEach(g=>H+=40+Math.ceil(g.it.length/COLS)*(TH+G));H+=P;
 const cv=document.createElement('canvas');cv.width=W;cv.height=Math.max(H,80);
 const x=cv.getContext('2d');x.fillStyle='#101116';x.fillRect(0,0,W,cv.height);
 const F='Montserrat,system-ui,sans-serif';let y=P;
 if(hd){x.textBaseline='top';x.fillStyle='#fff';x.font='800 28px '+F;if(S.t)x.fillText(S.t,P,y);if(S.u){x.fillStyle='#8d92a6';x.font='600 15px '+F;x.fillText(S.u,P,y+(S.t?36:2))}y+=hd}
 gs.forEach(g=>{x.textBaseline='top';x.fillStyle=g.c;x.font='800 20px '+F;x.fillText(g.n,P,y+4);x.fillStyle='#2a2d3a';x.fillRect(P,y+32,W-P*2,2);y+=40;
  g.it.forEach((i,k)=>{const o=ITEMS[i],v=S.lv[o.n]||0,px=P+(k%COLS)*(TW+G),py=y+Math.floor(k/COLS)*(TH+G),c=RC[o.r];
   x.globalAlpha=v?1:.35;x.fillStyle='#181a22';rr(x,0,px,py,TW,TH,10);x.fill();x.save();rr(x,0,px,py,TW,TH,10);x.clip();
   const im=imgs[i];if(im.complete&&im.naturalWidth){const s=Math.min(134/im.naturalWidth,100/im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s;x.drawImage(im,px+(TW-w)/2,py+8+(100-h)/2,w,h)}
   x.fillStyle='#0d0e13';x.fillRect(px,py+TH-50,TW,50);x.restore();
   x.strokeStyle=c;x.lineWidth=3;rr(x,0,px+1.5,py+1.5,TW-3,TH-3,9);x.stroke();
   x.textAlign='center';x.textBaseline='middle';x.fillStyle=c;x.font='800 13px '+F;x.fillText(o.n,px+TW/2,py+TH-36);
   x.fillStyle=v===MAX?'#ffc83d':'#9a9aa5';x.font='800 12px '+F;x.fillText(v?(v===MAX?'MAX':'LVL '+v):'—',px+TW/2,py+TH-14);if(v&&S.evo[o.n]){x.fillStyle='#7c3aed';rr(x,0,px+TW-48,py+8,40,18,5);x.fill();x.fillStyle='#fff';x.font='800 11px '+F;x.fillText('EVO',px+TW-28,py+17.5)}x.textAlign='left';x.globalAlpha=1});
  y+=Math.ceil(g.it.length/COLS)*(TH+G)});
 return cv}
let tm;function draw(){clearTimeout(tm);tm=setTimeout(()=>{const s=render(),c=$('cv');c.width=s.width;c.height=s.height;c.getContext('2d').drawImage(s,0,0)},60)}
const blob=()=>new Promise(r=>render().toBlob(r,'image/png'));
$('t').value=S.t;$('u').value=S.u;$('sort').value=S.sort;
$('t').oninput=e=>{S.t=e.target.value;sync()};$('u').oninput=e=>{S.u=e.target.value;sync()};
$('sort').onchange=e=>{S.sort=e.target.value;build()};
$('un').onclick=()=>{S.un=!S.un;sync()};
$('all').onclick=()=>{ITEMS.forEach(o=>{if(!S.lv[o.n])S.lv[o.n]=MAX});sync()};
$('none').onclick=()=>{S.lv={};sync()};
$('max').onclick=()=>{ITEMS.forEach(o=>{if(S.lv[o.n])S.lv[o.n]=MAX});sync()};
$('reset').onclick=()=>{if(confirm('Clear all selections?')){S={lv:{},evo:{},t:'',u:'',sort:'r',un:false};$('t').value='';$('u').value='';$('sort').value='r';build()}};
$('dl').onclick=async()=>{const b=await blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='envanter.png';a.click();toast('Downloaded')};
$('copy').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':await blob()})]);toast('Image copied')}catch(e){toast('Copy failed, use Download instead')}};
build();
</script></body></html>
